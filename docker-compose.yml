services:
  mongo:
    image: mongo:8
    container_name: cdiscam-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Replica set mono-noeud : requis pour les transactions MongoDB
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  # Optionnel : docker compose --profile tools up -d  ->  http://localhost:8081
  mongo-express:
    image: mongo-express:latest
    container_name: cdiscam-mongo-express
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo_data:
